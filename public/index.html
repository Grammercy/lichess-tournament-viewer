<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161512"><meta name="description" content="Follow every game in a Lichess Arena or Swiss tournament on one board wall.">
  <title>Tournament Viewer</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Tournament View home"><img src="/lichess.svg" alt="" width="36" height="36"><span>lichess<span class="brand-org">.org</span></span></a>
    <div class="header-divider"></div><span class="product-name">Tournament view</span>
    <div class="header-end"><a href="https://lichess.org/tournament" target="_blank" rel="noopener">Explore tournaments <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3h7v7M21 3l-11 11M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a><button class="icon-button" id="theme-button" title="Switch to light theme" aria-label="Switch to light theme"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.9 13.1A9 9 0 0 1 10.9 3.1 9 9 0 1 0 20.9 13.1Z"/></svg></button></div>
  </header>
  <div class="app-shell awaiting-tournament">
    <aside class="sidebar">
      <div class="sidebar-heading"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3h8v6a4 4 0 0 1-8 0V3Zm0 2H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 1v7m-5 1h10"/></svg> TOURNAMENT</div>
      <form id="tournament-form" class="tournament-form">
        <label for="tournament-input">Tournament link or ID</label>
        <div class="link-input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m10 13 4-4m-7 5-1 1a4 4 0 0 0 6 6l4-4a4 4 0 0 0 0-6m1-1 1-1a4 4 0 0 0-6-6L8 7a4 4 0 0 0 0 6"/></svg><input id="tournament-input" placeholder="lichess.org/tournament/…" autocomplete="off" spellcheck="false" required></div>
        <button class="watch-button" id="watch-button" type="submit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg> Watch tournament</button>
      </form>
      <section class="tournament-panel" id="tournament-panel" hidden>
        <div class="tournament-emblem"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 7h16v12a8 8 0 0 1-16 0V7Zm0 4H8v5a8 8 0 0 0 8 8m16-13h8v5a8 8 0 0 1-8 8m-16 0-8 8m-8 6h16m-12-6h8v6H20Z"/></svg></div>
        <span class="eyebrow" id="tournament-kind"></span><h2 id="tournament-name"></h2>
        <div class="tournament-badges"><span id="tournament-status" class="tag"></span><span id="rated-label"></span></div>
        <dl class="tournament-facts"><div><dt>Time control</dt><dd id="time-control"></dd></div><div><dt>Players</dt><dd id="player-count"></dd></div><div><dt>Duration</dt><dd id="duration"></dd></div></dl>
        <a id="tournament-external" class="text-link" href="https://lichess.org/tournament" target="_blank" rel="noopener">View on Lichess <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3h7v7M21 3l-11 11M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg></a>
      </section>
      <section class="standings-panel" id="standings-panel" hidden><div class="section-label">TOP PLAYERS <span>POINTS</span></div><ol id="standings"></ol><p id="standings-note" class="form-hint"></p></section>
    </aside>
    <main>
      <div class="page-heading" id="page-heading" hidden><h1 id="page-tournament-name"></h1><div class="update-status" id="update-status"></div></div>
      <div class="summary-strip" id="summary-strip" hidden><div><span class="summary-number" id="total-count">0</span><span>games</span></div><span class="strip-divider"></span><div><span class="live-dot"></span><span class="summary-number" id="playing-count">0</span><span>playing</span></div><span class="strip-divider"></span><div><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 12 4 4L19 6"/></svg><span class="summary-number" id="finished-count">0</span><span>finished</span></div><div class="summary-end"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="update-caption"></span></div></div>
      <div class="toolbar" id="toolbar" hidden><div class="game-tabs" role="tablist" aria-label="Games"><button class="game-tab" role="tab" aria-selected="false" data-filter="all">All games <span id="tab-all">0</span></button><button class="game-tab active" role="tab" aria-selected="true" data-filter="playing">Playing <span id="tab-playing">0</span></button><button class="game-tab" role="tab" aria-selected="false" data-filter="finished">Finished <span id="tab-finished">0</span></button></div><div class="view-controls"><label class="search-input"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="player-search" placeholder="Find a player" aria-label="Find a player"></label><div class="density-controls" aria-label="Board size"><button class="icon-button" data-density="comfortable" title="Larger boards" aria-label="Larger boards"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button><button class="icon-button selected" data-density="compact" title="More boards" aria-label="More boards"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 10h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4zM3 17h4v4H3zm7 0h4v4h-4zm7 0h4v4h-4z"/></svg></button></div><button id="refresh-button" class="icon-button" title="Refresh games" aria-label="Refresh games"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 7v5h-5M4 17v-5h5m-4-3a8 8 0 0 1 13-4l3 3M3 16l3 3a8 8 0 0 0 13-4"/></svg></button></div></div>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <div class="no-tournament" id="no-tournament" role="status">
        <div class="homura-prompt">
          <img class="homura-icon" src="/homura.png" alt="Homura Akemi" width="171" height="350" draggable="false">
          <button id="paste-link-prompt" class="prompt-bubble" type="button" aria-controls="tournament-input">
            <span class="prompt-title">Paste a tournament link</span>
            <span class="prompt-hint">Then choose Watch tournament.</span>
          </button>
        </div>
      </div>
      <section id="game-grid" class="game-grid compact" aria-label="Tournament games"></section>
      <div id="empty-state" class="empty-state" hidden><img src="/pieces/wN.svg" alt="" width="64" height="64"><h2 id="empty-title">No games to show</h2><p id="empty-message">Try another player or game filter.</p></div>
      <footer class="main-footer" id="main-footer" hidden><span id="visible-caption"></span></footer>
    </main>
  </div>
  <dialog id="game-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title">Game</h2><button id="close-dialog" class="icon-button" aria-label="Close game"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div id="dialog-content"></div></dialog>
</body>
</html>
